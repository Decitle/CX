name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cx-ci-${{ github.ref }}
  # Keep a running native matrix alive while a follow-up commit queues a new run.
  # This preserves completed platform evidence and downloadable artifacts.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            architecture: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - target: windows-x86_64
            runner: windows-2022
            architecture: x64
          - target: windows-arm64
            runner: windows-11-arm
            architecture: ARM64
          - target: macos-x86_64
            runner: macos-15-intel
            architecture: x86_64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux graphical build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libfreetype6-dev libharfbuzz-dev libudev-dev libx11-dev libxrandr-dev \
            libxcursor-dev libxi-dev xvfb

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build -A ${{ matrix.architecture }}
          -DCMAKE_BUILD_TYPE=Release
          -DCX_FETCH_SFML=ON
          -DCX_ENABLE_SFML_AUDIO=OFF
          -DCX_BUILD_TESTS=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCX_FETCH_SFML=ON
          -DCX_ENABLE_SFML_AUDIO=OFF
          -DCX_BUILD_TESTS=ON

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }}
          -DCX_FETCH_SFML=ON
          -DCX_ENABLE_SFML_AUDIO=OFF
          -DCX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run CTest
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Check quickstart scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Release/cx-cli.exe --check examples/quickstart

      - name: Check quickstart scripts (Linux and macOS)
        if: runner.os != 'Windows'
        run: ./build/cx-cli --check examples/quickstart

      - name: Graphical startup smoke test (Windows)
        if: runner.os == 'Windows'
        run: python tools/smoke_graphical.py --engine ./build/Release/cx-engine.exe --project examples/quickstart --seconds 6

      - name: Graphical startup smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python tools/smoke_graphical.py --engine ./build/cx-engine --project examples/quickstart --seconds 6

      # Exercise the exact install-and-package path on every native target.
      # This catches release-only packaging regressions before a version tag is created.
      - name: Set package version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(CXEngine VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success) { throw 'Could not read CXEngine project version from CMakeLists.txt' }
          "CX_VERSION=$($match.Groups[1].Value)" >> $env:GITHUB_ENV

      - name: Set package version (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^project\(CXEngine VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)"
          test -n "$VERSION"
          echo "CX_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install runtime dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --install build --config Release --prefix stage

      - name: Install runtime dependencies (Linux and macOS)
        if: runner.os != 'Windows'
        run: cmake --install build --prefix stage

      - name: Package starter runtime
        shell: bash
        run: >-
          python tools/package_runtime.py
          --stage stage
          --project examples/quickstart
          --build-dir build
          --source-root .
          --target ${{ matrix.target }}
          --version "$CX_VERSION"
          --output-dir dist

      - name: Upload native runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: CXEngine-${{ matrix.target }}-${{ github.run_number }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
